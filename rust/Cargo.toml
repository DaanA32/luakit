[package]
name = "luakit-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "luakit"
path = "src/luakit.rs"

[lib]
name = "luakit"
path = "src/luakit.rs"
crate-type = ["dylib"]

[dependencies]
c2rust-bitfields = "0.20.0"
libc = "0.2.174"
mlua-sys = { version = "0.8.1", features = [ "lua52" ] }
webkit2gtk = { version = "2.0.1", features = [ "v2_16"] }
gio-sys = "0.18.1"
glib-sys = "0.18.1"
gtk-sys = "0.18.1"
gdk-sys = "0.18.1"
javascriptcore-rs-sys = "1.1.1"
