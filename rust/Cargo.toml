[package]
name = "luakit-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "luakit"
path = "src/luakit.rs"

[lib]
name = "luakit"
path = "src/luakit.rs"
crate-type = ["dylib"]

[dependencies]
c2rust-bitfields = "0.20.0"
# c2rust-bitfields = { path = "../../c2rust/c2rust-bitfields/" }
# c2rust = { path = "../../c2rust/c2rust/" }
libc = "0.2.174"
glib-sys = "0.20.10"
lua = "0.0.10"
