[package]
name = "luakit-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "luakit"
path = "src/main.rs"

[lib]
name = "luakit"
path = "src/lib.rs"
crate-type = ["dylib"]

[dependencies]
libc = "0.2.174"
mlua-sys = { version = "0.8.1", features = [ "lua51" ] }
webkit2gtk = { version = "2.0.1", features = [ "v2_16"] }
gio-sys = "0.18.1"
# glib = "0.18.1"
glib-sys = { version = "0.18.1", features = ["v2_78"] }
gtk-sys = "0.18.1"
gdk-sys = "0.18.1"
javascriptcore-rs-sys = "1.1.1"
