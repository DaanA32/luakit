[package]
name = "luakit-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "luakit"
path = "src/luakit.rs"

[lib]
name = "luakit"
path = "src/luakit.rs"
crate-type = ["dylib"]

[dependencies]
c2rust-bitfields = "0.20.0"
libc = "0.2.174"
glib-sys = "0.20.10"
lua = "0.0.10"
gtk4-sys = "^0.9.0"
gdk4-sys = "^0.9.0"
webkit2gtk = { version = "2.0.1", features = [ "v2_16"] }
gio-sys = "0.20.10"
